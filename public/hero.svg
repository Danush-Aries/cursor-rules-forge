<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#12082b"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="380" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="90" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui" font-weight="700" font-size="34" fill="url(#grad)">
    .cursor/rules/  for any repo
  </text>

  <!-- URL input mockup -->
  <g transform="translate(120,140)">
    <rect width="480" height="64" rx="12" fill="#1a1428" stroke="#2a2140"/>
    <text x="24" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#c4b5fd">
      https://github.com/vercel/next.js
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <rect x="26" y="18" width="2" height="30" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Forge button -->
  <g transform="translate(620,140)" filter="url(#glow)">
    <rect width="170" height="64" rx="12" fill="url(#btn)"/>
    <text x="85" y="41" text-anchor="middle" font-family="Inter, ui-sans-serif" font-weight="600" font-size="17" fill="white">
      Forge my rules
    </text>
  </g>

  <!-- ZIP contents card -->
  <g transform="translate(140,240)">
    <rect width="620" height="115" rx="14" fill="#0f0a1e" stroke="#231941"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94a3b8">.cursor/rules/</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">
      <text x="40" y="54">general.mdc</text>
      <text x="40" y="72">typescript.mdc</text>
      <text x="40" y="90">react.mdc</text>
      <text x="220" y="54">nextjs.mdc</text>
      <text x="220" y="72">node-testing.mdc</text>
      <text x="220" y="90">monorepo.mdc</text>
    </g>
    <g transform="translate(430,50)">
      <rect width="170" height="46" rx="8" fill="#1e1633" stroke="#3a2d5c"/>
      <text x="85" y="29" text-anchor="middle" font-family="Inter, ui-sans-serif" font-weight="500" font-size="13" fill="#c4b5fd">
        next.js-cursor-rules.zip
      </text>
    </g>
  </g>
</svg>
